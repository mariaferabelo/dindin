<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DinDin - Controle Financeiro</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header class="topbar">
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="#Sobre">Sobre</a></li>
          <li><a href="#Blog">Blog</a></li>
        </ul>
      </nav>
    </header>

    <main class="content">
      <h1 class="title">DinDin</h1>

      <div class="logo">
        <img src="assets/logo.png" alt="Cofrinho de porquinho do DinDin" />
      </div>

      <div class="form-login">
        <form>
          <fieldset>
            <label for="email">Usuário</label>
            <input
              class="input"
              type="email"
              id="email"
              name="email"
              required
              placeholder="Entre com o seu email..."
            />

            <label for="senha">Senha:</label>
            <input
              class="input"
              type="password"
              id="senha"
              name="senha"
              required
              minlength="8"
              placeholder="Entre com a sua senha..."
            />
          </fieldset>

          <button type="submit" class="btn btn-entrar">ENTRAR</button>
        </form>
      </div>
    </main>

    <footer></footer>
  </body>
</html>
